<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" width="250" height="48" fill="none">
  <defs>
    <linearGradient id="cvBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA100" />
      <stop offset="45%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF1E56" />
    </linearGradient>
    <linearGradient id="cvVerse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6000" />
      <stop offset="100%" stop-color="#FF1E56" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Badge: Transparent background, pure vector -->
  <g>
    <rect x="0" y="2" width="36" height="36" rx="8" fill="url(#cvBadge)" />
    <rect x="0.5" y="2.5" width="35" height="35" rx="7.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" />
    <!-- Crisp, Bold Pure White C -->
    <path d="M 28 11.5 C 25.5 9.8 22 8.8 17.5 8.8 C 11 8.8 7 13.8 7 20 C 7 26.2 11 31.2 17.5 31.2 C 22 31.2 25.5 30.2 28 28.5" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <!-- Gap cutout -->
    <path d="M 13.5 13.5 L 20.5 28 L 27.5 13.5" stroke="url(#cvBadge)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Bold Pure White V -->
    <path d="M 13.5 13.5 L 20.5 28 L 27.5 13.5" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(46, 0)">
    <text x="0" y="26.5" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" letter-spacing="0.8">
      <tspan fill="#FFFFFF">CHILL</tspan>
      <tspan fill="url(#cvVerse)">VERSE</tspan>
    </text>
    <text x="1" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="700" fill="#94A3B8" letter-spacing="2">
      ENTERTAINMENT • FANDOM PORTAL
    </text>
  </g>
</svg>
